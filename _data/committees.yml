permanent:
  - text: 'I am the Regional Editor for Europe of the <a href="https://www.ijpe-online.com/">International Journal of Performability Engineering</a>.'
  - text: 'I am a member of the Editorial Board of <a href="https://www.springer.com/series/8851">Transactions on Computational Collective Intelligence</a> and an Associate Editor of the <a href="https://www.worldscientific.com/worldscinet/vjcs">Vietnam Journal of Computer Science</a>.'
  - text: 'I am a member of the <a href="https://rs.ieee.org/technical-activities/technical-committees/system-and-software-assurance.html">IEEE Reliability Society Technical Committee on Systems and Software Assurance</a> and of the IEEE SMC Technical Committee on Computational Collective Intelligence.'
  - text: 'I am a member of the Board of Directors of the Tarot Summer School on Software Testing.'
  - text: 'I am a member of the QRS Steering Committee.'
  - text: 'I am a member of the ICCCI Senior Programme Committee.'
  - text: 'I am a member of the A-MOST Steering Committee.'
  - text: 'I am a member of the SEFM Steering Committee.'
  - text: 'I was a member of the ICTSS Steering Committee (formerly TestCom/FATES) for the period 2009–2012 and of the DisCoTec Steering Committee for the period 2019–2024.'

