permanent:

  - html: >-
      I am the Regional Editor for Europe of the
      <a href="https://www.ijpe-online.com/">International Journal of Performability Engineering</a>.
      I am a member of the Editorial Board of
      <a href="https://www.springer.com/series/8851">Transactions on Computational Collective Intelligence</a>
      and an Associate Editor of the
      <a href="https://www.worldscientific.com/worldscinet/vjcs">Vietnam Journal of Computer Science</a>.

  - html: >-
      I am a member of the
      <a href="https://rs.ieee.org/technical-activities/technical-committees/system-and-software-assurance.html">IEEE Reliability Society Technical Committee on Systems and Software Assurance</a>
      and of the
      <a href="https://www.ieeesmc.org/technical-activities/cybernetics/computational-collective-intelligence">IEEE SMC Technical Committee on Computational Collective Intelligence</a>.

  - html: >-
      I am a member of the Board of Directors of the Tarot Summer School on Software Testing.
      The <a href="https://tarot2025.dieti.unina.it/">last edition</a>
      of the Summer School took place in Naples (Italy).

  - html: >-
      I am a member of the QRS Steering Committee.
      The <a href="https://qrs25.techconf.org/">last edition</a>
      of the conference took place in Hangzhou (China).

  - html: >-
      I am a member of the ICCCI Senior Programme Committee.
      The <a href="https://iccci.pwr.edu.pl/2025/">last edition</a>
      of the conference took place in Ho Chi Minh City (Vietnam).

  - html: >-
      I am a member of the A-MOST Steering Committee.
      The <a href="https://conf.researchr.org/home/icst-2025/a-most-2025">last edition</a>
      of the workshop took place in Naples (Italy), collocated with ICST 2025.

  - html: >-
      I am a member of the SEFM Steering Committee.
      The <a href="https://sefm-conference.github.io/2025/">last edition</a>
      of the conference took place in Toledo (Spain).

  - html: >-
      I was a member of the ICTSS Steering Committee (formerly known as TestCom/FATES)
      for the period 2009-2012 and of the
      <a href="https://www.discotec.org/">DISCOTEC Steering Committee</a>
      for the period 2019-2024.

